name: Enterprise CI Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-and-test:
    name: Backend Test Suite (Phases 1-10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer_support_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint and syntax validation
        run: |
          python -m py_compile $(find backend/app backend/tests -name "*.py")

      - name: Execute Pytest across all 10 platform phases
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/customer_support_test_db
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_32_characters_long_for_ci_checks
        run: |
          cd backend
          pytest -v tests/test_health.py \
                    tests/test_auth.py \
                    tests/test_tickets.py \
                    tests/test_conversations.py \
                    tests/test_knowledge.py \
                    tests/test_rag.py \
                    tests/test_ml.py \
                    tests/test_copilot.py \
                    tests/test_analytics.py \
                    tests/test_webhooks_and_production.py

  frontend-build-and-lint:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compile & Check
        run: npm run build

  container-security-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-build-and-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker compose -f docker-compose.prod.yml build
